name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x numen-api/gradlew minecraft-numen/gradlew

      - name: Test Numen API
        working-directory: numen-api
        run: ./gradlew test --stacktrace

      - name: Publish Numen API for the core build
        working-directory: numen-api
        run: ./gradlew publish --stacktrace

      - name: Test and package Numen core
        working-directory: minecraft-numen
        run: >-
          ./gradlew test :common:javadoc :fabric:build :neoforge:build
          verifyTagResources --stacktrace
